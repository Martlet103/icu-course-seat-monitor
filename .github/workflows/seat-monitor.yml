name: Monitor ICU course seat

on:
  schedule:
    # GitHub schedules are UTC. This runs at 00, 05, 10, ... minutes each hour.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start_gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.gate.outputs.active }}
    steps:
      - id: gate
        shell: bash
        run: |
          if [[ "$(TZ=Asia/Tokyo date +%Y%m%d%H%M)" < "202609050900" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Monitoring begins at 2026-09-05 09:00 JST."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

  check-seat:
    needs: start_gate
    if: needs.start_gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check ISC104 (registration number 21342)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        # A nonzero status when a seat opens triggers GitHub email.
        run: python3 monitor.py --state-file /tmp/seat-monitor-state.json --fail-when-open
